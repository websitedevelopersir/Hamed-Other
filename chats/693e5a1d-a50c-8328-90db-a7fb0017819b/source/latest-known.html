<div class="custom-gallery-wrapper">
  <div class="gallery-track"></div>
</div>

<style>
  .custom-gallery-wrapper {
    width: 100%;
    overflow: hidden;
    direction: ltr;
    font-family: YekanbakhR, sans-serif;
  }

  .gallery-track {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .gallery-item {
    position: relative;
    flex: 0 0 auto;
    overflow: hidden;
    border-radius: 20px;
    cursor: pointer;
    opacity: 0;
    transform: scale(.965);
    transition:
      width .45s ease,
      height .45s ease,
      opacity .35s ease,
      transform .45s ease;
  }

  .gallery-item.is-visible {
    opacity: 1;
    transform: scale(1);
  }

  .gallery-item.is-center {
    z-index: 3;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 20px;
    user-select: none;
    -webkit-user-drag: none;
  }

  @media (max-width: 767px) {
    .gallery-track {
      gap: 10px;
    }
  }
</style>

<script>
(function () {
  'use strict';

  const wrapper = document.querySelector('.custom-gallery-wrapper');
  const galleryTrack = wrapper && wrapper.querySelector('.gallery-track');
  if (!wrapper || !galleryTrack) return;

  // The real URLs in the last chat snapshot were truncated as
  // https://mohammad.websitestest.ir/...
  // Replace these placeholders with the real production image URLs.
  const images = [
    'REPLACE_WITH_IMAGE_1_URL',
    'REPLACE_WITH_IMAGE_2_URL',
    'REPLACE_WITH_IMAGE_3_URL',
    'REPLACE_WITH_IMAGE_4_URL',
    'REPLACE_WITH_IMAGE_5_URL'
  ];

  const proportions5 = [0.55, 0.75, 1.0, 0.75, 0.55];
  const proportions3 = [0.75, 1.0, 0.75];

  const ratios5 = [
    244 / 300,
    348 / 250,
    520 / 374,
    348 / 250,
    244 / 300
  ];

  const ratios3 = [
    348 / 250,
    520 / 374,
    348 / 250
  ];

  let currentIndex = 0;
  let autoTimer = null;
  let resizeTimer = null;

  function mod(value, length) {
    return ((value % length) + length) % length;
  }

  function getVisibleIndexes(count) {
    if (count === 3) {
      return [
        mod(currentIndex - 1, images.length),
        currentIndex,
        mod(currentIndex + 1, images.length)
      ];
    }

    return [
      mod(currentIndex - 2, images.length),
      mod(currentIndex - 1, images.length),
      currentIndex,
      mod(currentIndex + 1, images.length),
      mod(currentIndex + 2, images.length)
    ];
  }

  function renderGallery() {
    const isMobile = window.innerWidth <= 767;
    const count = isMobile ? 3 : 5;
    const proportions = isMobile ? proportions3 : proportions5;
    const ratios = isMobile ? ratios3 : ratios5;
    const centerPosition = Math.floor(count / 2);
    const gap = isMobile ? 10 : 16;
    const containerWidth = wrapper.clientWidth;
    const usableWidth = Math.max(0, containerWidth - gap * (count - 1));
    const totalProportion = proportions.reduce(function (sum, value) {
      return sum + value;
    }, 0);
    const unitWidth = usableWidth / totalProportion;
    const visibleIndexes = getVisibleIndexes(count);

    galleryTrack.innerHTML = '';

    visibleIndexes.forEach(function (imageIndex, position) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      if (position === centerPosition) item.classList.add('is-center');

      const itemWidth = unitWidth * proportions[position];
      const itemHeight = itemWidth * ratios[position];

      item.style.width = itemWidth + 'px';
      item.style.height = itemHeight + 'px';
      item.dataset.imageIndex = String(imageIndex);

      item.innerHTML = '<img src="' + images[imageIndex] + '" alt="Gallery Image">';

      item.addEventListener('click', function () {
        currentIndex = Number(item.dataset.imageIndex);
        renderGallery();
      });

      galleryTrack.appendChild(item);

      requestAnimationFrame(function () {
        item.classList.add('is-visible');
      });
    });
  }

  function stopAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  function startAuto() {
    stopAuto();
    autoTimer = setInterval(function () {
      currentIndex = mod(currentIndex + 1, images.length);
      renderGallery();
    }, 3000);
  }

  wrapper.addEventListener('mouseenter', stopAuto);
  wrapper.addEventListener('mouseleave', startAuto);

  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderGallery, 120);
  });

  renderGallery();
  startAuto();
})();
</script>
